services:
  tomcat:
    image: tomcat:10-jdk21
    container_name: tomcat-dev
    ports:
      - "8080:8080"
    volumes:
      - ./../../target/docker-servlet.war:/usr/local/tomcat/webapps/ROOT.war
      - ./../../logs:/usr/local/tomcat/logs
    restart: no
  # The database is embedded, in-memory H2 running inside the Tomcat JVM
  # (see DBConnectionutil). No separate DB container is needed.
